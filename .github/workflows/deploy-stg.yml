# STG（自宅サーバー）へのアプリ（Next.js + MySQL）スタックデプロイ。
# 前提は他スタックと同じ（self-hosted runner ラベル character-stg、$STG_ROOT 配下に clone 済み）。
# DB・API スタックが先に起動済みで character-db-net 経由で character-api に到達できること。
name: Deploy STG (home)

# STG は `staging` ブランチの鏡。develop マージでは STG を触らない。staging へ promote
# するか手動（workflow_dispatch）でデプロイ。runner オフライン時は queue → online で消化。
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: stg-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, character-stg]
    steps:
      - name: Pull & up (Next.js + MySQL)
        env:
          STG_ROOT: ${{ vars.STG_ROOT }}
        run: |
          set -euo pipefail
          ROOT="${STG_ROOT:-$HOME/character-system}"
          cd "$ROOT/applications/character-application-nextjs"
          git fetch origin staging && git reset --hard origin/staging
          # 起動時に docker-entrypoint.sh が prisma migrate deploy を実行する。
          # override（ローカル開発用。MySQL のホスト公開を含む）を読み込まないよう
          # -f で base + stg を明示する。STG が公開するのはダッシュボード 3000 のみ。
          docker compose -f docker-compose.yml -f docker-compose.stg.yml up -d --build
